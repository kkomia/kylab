# 前端站点配置（M7）。
#
# 三件事：**SPA 回退**、**/api 反代**、**静态资源缓存**。
#
# 反代是必须的：前端全部请求走相对路径 `/api/v1`（见 src/api/client.ts），
# 同源就没有跨域问题，也就不必去维护 CORS 白名单——
# 生产上配错 CORS 是"本机好用、部署后全 401"的常见来源。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传文档会走这个入口，默认 1m 太小（架构允许到 200MB，见后端 MAX_UPLOAD_BYTES）
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 带内容 hash 的构建产物可以长缓存：文件名变了内容才会变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **对话是 SSE 流式**：关掉缓冲，否则用户要等整段回答写完才看到第一个字
        # （后端也发了 X-Accel-Buffering: no，两边都要）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # SPA 回退：/kb/xxx、/chat/xxx 这些客户端路由刷新时要能落到 index.html，
    # 否则直接打开或刷新子页面会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：它是引用带 hash 资源的入口，缓存住会让用户
    # 一直加载旧版本的资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
