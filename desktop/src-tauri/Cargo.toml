[package]
name = "kylab-desktop"
version = "0.1.0"
description = "KYLAB 桌面壳：连到 NAS 上的服务，壳里没有服务端"
authors = ["KYLAB"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 壳做四件事：开窗、记住地址、探活、**起停边车**。依赖仍然很少：
# tauri（窗口与 IPC）、ureq（探活与边车 /health）、serde/serde_json（配置与探针响应）。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# 资源热更新那一半（规格 §4/§5）：拿清单 → 下包 → **校验 sha256** → 解压 → 原子切指针。
# `zip` 是新引入的（tauri 的依赖树里只有 flate2/miniz_oxide，没有 zip 这一层）；
# `sha2` 本来就在依赖树里（传递依赖），这里提成直接依赖。两者都关掉默认特性，
# 只留 deflate（包是我们自己的 `pnpm build` 产物，用不到 bzip2/zstd 那些分支）。
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 设备身份：`config.json` 里的 `device_id`（第一次连上服务器时生成一个 UUID v4）。
# `uuid` 本来就在依赖树里（传递依赖），这里**提成直接依赖**并开 `v4`
# （= 要随机数）。**别用时间戳/序号代替**：几台电脑可能在同一秒里各自生成，
# 撞了就等于两台机器共用一个工作区。
uuid = { version = "1", features = ["v4"] }

# Windows：Job Object —— 让边车（python 子进程）**随壳一起退出**（壳崩了也不留孤儿 python）。
# 用 `windows`（高阶层）而不是 `windows-sys`：实测 windows-sys 0.52/0.59/0.61 的
# `Win32::System::JobObjects` 里**只有常量与结构体、没有那几个函数** ✗。
# 只在 Windows 上编译；别的平台靠 `RunEvent::Exit` 里的 stop()（见 src/sidecar.rs 的 job 模块）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
