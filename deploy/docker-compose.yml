# kylab 一键起（M7 / T7.1；v0.12 起为 PostgreSQL + MinIO + 后端 + 前端 四件套）。
#
# **部分已验证**：开发机没有 docker（计划里的风险 R9），所以这份 compose 整体
# 仍未经"一键起"实测。但其中的 postgres 服务**已按这一份定义在真实部署服务器上
# 跑通**（同一个镜像 pgvector/pgvector:pg17-trixie，kylab-postgres 健康，
# PG 17.11 + pgvector 0.8.6，schema 由应用自检引导成功，HNSW + KNN 实测可用），
# 见 docs/部署与运行-v0.1.md。minio 相关 service 与整体编排仍待实测。
#
# 本地开发仍可走 venv + 脚本那条路线（见 docs/部署与运行-v0.1.md）。
#
# schema 由 **应用** 在启动时拥有（单一属主，避免两个真相来源）。现在可直接用
# 应用自带的自检入口引导/校验，不必手工 psql：
#   python -m app.storage.postgres_impl.validate
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# 起来之后：
#   界面        http://localhost:8080
#   API         http://localhost:8080/api/v1/health
#   MinIO 控制台 http://localhost:9001（账号密码同 KYLAB_S3_ACCESS_KEY/SECRET_KEY）
#
# 存储分工（架构设计 v0.2 §8）：
#   postgres  元数据 + 向量(pgvector) + 全文(tsvector)
#   minio     原件 / Markdown 产物 / 图片
#   kylab-data 卷  DuckDB 表格副本（以及未配 S3 时的原件回退目录）
name: kylab

services:
  # ---- PostgreSQL（含 pgvector）----
  #
  # 官方 pgvector 镜像：只带 vector 一个扩展，许可证是 PostgreSQL License，
  # 镜像干净、版本可预期。
  #
  # 选 pg17 而不是 pg18：**开发服务器上跑的就是这一个镜像**（kylab-postgres，
  # PG 17.11 + pgvector 0.8.6），同一版本、同一扩展，避免"开发能跑、
  # 部署行为不同"这类最难查的问题。改这里等于同时改开发环境，别单独动。
  #
  # 要升大版本（如 pg18-trixie）必须按 PostgreSQL 的版本升级流程处理数据目录，
  # 不是改一行 tag 的事。
  #
  # 若需要 BM25 全文检索（pg_search）或 PostGIS，可换 paradedb/paradedb：
  # 它自带这些扩展，但**社区版是 AGPLv3**，且会在 public 下建
  # spatial_ref_sys（PostGIS）等与项目无关的对象。当前 schema 用的是
  # 内建 tsvector，不需要它。
  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KYLAB_PG_USER:-kylab}
      POSTGRES_PASSWORD: ${KYLAB_PG_PASSWORD:-kylab-dev-secret}
      POSTGRES_DB: ${KYLAB_PG_DB:-kylab}
      # 显式指定，避免数据落进镜像声明的匿名卷而不是我们挂的目录
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - kylab-pg:/var/lib/postgresql/data
    # PG 的并行查询要共享内存，默认 64MB 偏小
    shm_size: 256mb
    # 不对外暴露 5432：库只给 compose 网络内的后端用。
    # 需要从宿主机连（调试/迁移）时取消下面两行注释。
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KYLAB_PG_USER:-kylab} -d ${KYLAB_PG_DB:-kylab}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---- MinIO（S3 兼容对象存储）----
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # 与后端共用同一对凭据，避免"两处各写一份、改一处忘另一处"
      MINIO_ROOT_USER: ${KYLAB_S3_ACCESS_KEY:-kylab}
      MINIO_ROOT_PASSWORD: ${KYLAB_S3_SECRET_KEY:-kylab-dev-secret}
    volumes:
      - kylab-objects:/data
    ports:
      # 控制台只在宿主机本机可达；S3 API 端口供 compose 网络内的后端使用
      - "127.0.0.1:${KYLAB_MINIO_CONSOLE_PORT:-9001}:9001"
      - "127.0.0.1:${KYLAB_MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # 一次性任务：建桶。MinIO 不会自动建桶，没桶后端启动校验就会失败。
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_kylab: http://${KYLAB_S3_ACCESS_KEY:-kylab}:${KYLAB_S3_SECRET_KEY:-kylab-dev-secret}@minio:9000
    entrypoint:
      - /bin/sh
      - -c
      - "mc mb --ignore-existing kylab/${KYLAB_S3_BUCKET:-kylab}"
    restart: "no"

  backend:
    build:
      context: ../backend
    image: kylab-backend:${KYLAB_VERSION:-0.2.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # 数据都落在挂载卷里，容器重建不丢
      KYLAB_DATA_DIR: /data
      # ---- 存储后端 ----
      # 库与对象存储只走内网服务名；宿主机不暴露端口
      KYLAB_DATABASE_URL: postgresql://${KYLAB_PG_USER:-kylab}:${KYLAB_PG_PASSWORD:-kylab-dev-secret}@postgres:5432/${KYLAB_PG_DB:-kylab}
      KYLAB_S3_ENDPOINT: http://minio:9000
      KYLAB_S3_ACCESS_KEY: ${KYLAB_S3_ACCESS_KEY:-kylab}
      KYLAB_S3_SECRET_KEY: ${KYLAB_S3_SECRET_KEY:-kylab-dev-secret}
      KYLAB_S3_BUCKET: ${KYLAB_S3_BUCKET:-kylab}
      KYLAB_S3_REGION: ${KYLAB_S3_REGION:-us-east-1}
      # 容器内网互通走 http
      KYLAB_S3_SECURE: "false"
      # ---- 应用 ----
      # 鉴权**永远生效**（v0.11 起没有开关）。首次打开时访问界面会进
      # 「创建管理员账号」向导；在此之前业务接口一律 401。
      # 忘记密码没有 HTTP 应急入口，见 docs/部署与运行-v0.1.md 的恢复路径。
      # 签名下载链接用；不设则后端**拒绝签发**（而不是发一条无效链接）。
      # 不设也行：首次 setup 会自动生成一条并落库。
      KYLAB_URL_SIGNING_SECRET: ${KYLAB_URL_SIGNING_SECRET:-}
      # 允许的来源。走 nginx 同源反代时用不到，直连后端时需要
      KYLAB_CORS_ORIGINS: ${KYLAB_CORS_ORIGINS:-http://localhost:8080}
      # 内嵌消费线程：**单容器部署要留着它**，否则上传后没人处理队列
      KYLAB_RUN_WORKER: ${KYLAB_RUN_WORKER:-true}
    volumes:
      - kylab-data:/data
    # 不直接对外暴露 8000：统一从 nginx 进，避免绕过反代后
    # 出现"一半请求带 X-Forwarded-*、一半不带"的排查噩梦。
    # 需要直连调试时取消下面两行的注释
    # ports:
    #   - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ../frontend
    image: kylab-frontend:${KYLAB_VERSION:-0.2.0}
    restart: unless-stopped
    depends_on:
      backend:
        # 等后端健康再起 nginx：否则首屏会先看到一个 502，
        # 用户以为部署失败
        condition: service_healthy
    ports:
      - "${KYLAB_HTTP_PORT:-8080}:80"

volumes:
  kylab-data:
    # 具名卷由 docker 管理，位置随平台而变。
    # 要固定到某个路径（比如挂到 NAS）就换成 bind mount：
    #   driver_opts: { type: none, device: /srv/kylab, o: bind }
  kylab-pg:
    # PG 数据目录。**备份要在这里做**（pg_dump），不能靠拷文件：
    # 运行中的 data 目录直接拷贝是不一致的。
  kylab-objects:
    # MinIO 的对象数据（原件 / Markdown / 图片）
