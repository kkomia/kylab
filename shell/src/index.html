<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>KYLAB</title>
    <style>
      /* 引导页只有两个职责：
         ① 把真实前端从**本地资源目录**拉起来（`app://`）；
         ② 拉不起来时，给用户一个"连接 / 更换服务器"的入口。
         所以它**自包含**（样式与脚本都内联、不引任何邻居文件）——
         它是 exe 内置的兜底，资源目录整个坏掉时它还得能渲染。 */
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --surface: #fff;
        --fg: #1c1d21;
        --muted: #6b6f76;
        --border: #e3e5e9;
        --accent: #2563eb;
        --danger: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131417;
          --surface: #1b1d21;
          --fg: #eceef2;
          --muted: #9aa0a6;
          --border: #2b2e34;
          --accent: #3b82f6;
          --danger: #f97066;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      .card {
        width: min(420px, calc(100vw - 48px));
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      .sub {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 13px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 13px;
        color: var(--muted);
      }
      input {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.55;
        cursor: default;
      }
      .status,
      .error {
        margin: 12px 0 0;
        font-size: 13px;
      }
      .status {
        color: var(--muted);
      }
      .error {
        color: var(--danger);
      }
      .recent {
        margin-top: 18px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      .recent ul {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .recent button {
        margin: 0;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--accent);
        text-align: left;
        font: inherit;
        cursor: pointer;
      }
      .recent button:hover {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .foot {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin-bottom: 14px;
        border: 2.5px solid color-mix(in srgb, var(--muted) 35%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      [hidden] {
        display: none !important;
      }
      /* 「最近使用」那一段的间距走这条规则，**不用行内 style**：
         Tauri 给内置页注入的 CSP 带 nonce，而"有 nonce 时 'unsafe-inline' 失效"，
         行内 style 会被拦掉（实测控制台一条 CSP 违规 + 那一段的 margin 没了）。 */
      #recent .sub {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">正在加载界面…</h1>
      <p class="sub" id="sub">从本地读前端：先是热更新下来的那份，再是壳里自带的那份。</p>

      <form id="form" hidden novalidate>
        <div class="field">
          <label for="address">服务器地址</label>
          <input
            id="address"
            type="text"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="http://192.168.1.10:8000"
          />
        </div>
        <!-- 账号密码：**只用来登录一次**。壳不存密码，登录后领一把长期 API Key 存进配置。 -->
        <div class="field">
          <label for="username">用户名</label>
          <input
            id="username"
            type="text"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            placeholder="服务器上的账号"
          />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="服务器上的密码"
          />
        </div>
        <div class="field" id="confirm-field" hidden>
          <label for="confirm">确认密码</label>
          <input id="confirm" type="password" autocomplete="new-password" />
        </div>
        <button id="submit" type="submit">连接并进入</button>
        <p class="status" id="status" role="status" hidden></p>
        <p class="error" id="error" role="alert" hidden></p>
      </form>

      <div class="recent" id="recent" hidden>
        <p class="sub">最近使用</p>
        <ul id="recent-list"></ul>
      </div>

      <p class="foot" id="version"></p>
    </main>

    <script src="boot.js"></script>
  </body>
</html>
