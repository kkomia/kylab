# KYLAB CI 门禁（GitHub Actions 版）
#
# **默认不执行**：本仓库托管在 Gitee（gitee.com/kkomia/kylab），
# 真正生效的是 `.workflow/kylab-ci.yml`（Gitee Go）。
# 《开发计划 v0.1》§8 待决事项 D3 已于 2026-09-11 选定走 Gitee Go。
#
# 本文件保留有两处用途：
# 1. 将来若镜像到 GitHub，无需重写；
# 2. 它是"门禁应当包含哪些步骤"的一份可读清单（与 Gitee Go 那份等价）。
#
# 两处都调用**同一批脚本**（scripts/lint.sh / scripts/ci.sh），
# 所以不会出现"这份绿那份红"的分叉。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端（ruff + pytest + 规范扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # **必须带 `--all-extras`**：`app/core/storage.py` 会无条件构造 DuckDB 表格副本，
      # 少了 `tabular` 这个 extra，`import app.main` 直接 ModuleNotFoundError，
      # 测试在收集阶段就整体失败（实测 11s 红）。parsers/mcp 虽然是在函数内惰性导入、
      # 对应测试也写了 `importorskip`，但 CI 的职责是跑全量，不该让它们默认被跳过。
      - name: 安装依赖
        working-directory: backend
        run: uv sync --all-extras

      - name: ruff
        working-directory: backend
        run: uv run ruff check app/ tests/

      - name: pytest（跳过 bench 与 cloud）
        working-directory: backend
        run: uv run pytest tests/ -m "not bench and not cloud" --cov=app --cov-report=term-missing

      - name: emoji 扫描（后端）
        run: python3 scripts/scan_emoji.py backend/app

      - name: 分层纪律与测试位置
        run: python3 scripts/check_layering.py

  scripts:
    name: 门禁脚本自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 上面两个 job 只验证代码，不验证脚本本身。
      # .sh 的完整行为验证在本机 Git Bash 做过（含 Windows 无 python3 的坑），
      # 这里做语法自检，防止脚本被改坏后 CI 仍全绿。
      #
      # **按 git 跟踪的文件扫，不手写清单**：手写清单会漏——`deploy/nas/` 那两个
      # 脚本（其中 `deploy-from-windows.sh` 是用户照着跑的那条路）就是这么漏掉的。
      - name: Shell 脚本语法检查（全部 .sh）
        run: |
          files=$(git ls-files '*.sh')
          [ -n "$files" ] || { echo "::error::git ls-files 没列出任何 .sh"; exit 1; }
          for f in $files; do
            echo "  sh -n $f"
            sh -n "$f"
          done
          echo "共 $(echo "$files" | wc -l) 个脚本，语法全过。"

  frontend:
    name: 前端（eslint + vitest + 规范扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: eslint + prettier
        working-directory: frontend
        run: pnpm lint

      - name: 类型检查（tsc）
        working-directory: frontend
        run: pnpm typecheck

      - name: vitest
        working-directory: frontend
        run: pnpm test

      - name: 生产构建
        working-directory: frontend
        run: pnpm build

      - name: emoji 扫描（前端）
        run: python3 scripts/scan_emoji.py frontend/src
